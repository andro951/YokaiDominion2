name: Build and regression tests
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build engine-independent simulation
        run: dotnet build src/Yokai.Core/Yokai.Core.csproj -c Release
      - name: Run gameplay regressions
        run: dotnet run --project tests/Yokai.Core.Tests -c Release
      - name: Run match integration and soak tests
        run: dotnet run --project tests/Yokai.Match.Tests -c Release
      - name: Build Godot C# client
        run: dotnet build src/Yokai.Client/Yokai.Client.csproj -c Debug
  client-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install rendering dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y xvfb libgl1-mesa-dri libasound2t64
      - name: Audit committed character skin and provenance
        run: |
          mkdir -p artifacts
          python3 scripts/audit-game-asset.py src/Yokai.Client/Assets/Characters/Character01_Game001.glb | tee artifacts/skin-audit.log
      - name: Build C# client
        run: dotnet build src/Yokai.Client/Yokai.Client.csproj -c Debug
      - name: Download pinned Godot .NET editor
        run: bash scripts/install-godot.sh
      - name: Import, inspect actual poses, and render match
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set -euo pipefail
          editor=$(find "$PWD/.tools/editor" -type f -name 'Godot*' -executable | head -n 1)
          "$editor" --headless --editor --path src/Yokai.Client --import --quit 2>&1 | tee artifacts/import.log
          timeout 120 xvfb-run -a "$editor" --path src/Yokai.Client res://Scenes/CharacterReview.tscn --resolution 1280x720 --fixed-fps 60 --rendering-method gl_compatibility --audio-driver Dummy -- --capture="$PWD/artifacts/character-poses.png" 2>&1 | tee artifacts/character-review.log
          grep -q CHARACTER_REVIEW_OK artifacts/character-review.log
          timeout 300 xvfb-run -a "$editor" --path src/Yokai.Client --resolution 960x540 --fixed-fps 60 --rendering-method gl_compatibility --audio-driver Dummy -- --smoke --capture="$PWD/artifacts/arena.png" 2>&1 | tee artifacts/client.log
          grep -q SMOKE_OK artifacts/client.log
          grep -q CHARACTER_AVATAR_OK artifacts/client.log
          if grep -E 'SCRIPT ERROR|ERROR:' artifacts/client.log artifacts/character-review.log; then exit 1; fi
          cp src/Yokai.Client/Assets/Characters/Character01_Game001.glb artifacts/
          cp src/Yokai.Client/Assets/Characters/Character01_Game001.json artifacts/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: client-smoke-evidence
          path: artifacts/
          retention-days: 14
